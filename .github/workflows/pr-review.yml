name: AI PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    env:
      ANTHROPIC_BASE_URL: https://openrouter.ai/api
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.OPENROUTER_MODEL }}
    steps:
      - name: Check configuration
        id: config
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] || [ -z "$OPENROUTER_MODEL" ]; then
            echo "::notice::Set OPENROUTER_API_KEY and OPENROUTER_MODEL repository secrets to enable AI review."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check out trusted base tooling
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Review PR
        if: steps.config.outputs.ready == 'true' && hashFiles('.github/prompts/pr-review.md') != ''
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          prompt: |
            Review PR ${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Expected head: ${{ github.event.pull_request.head.sha }}.
            The checkout contains the trusted base, not the PR head. Read head
            sources through GitHub's API at the expected SHA; do not check them out.
            Follow the review policy appended to the system prompt and post one
            advisory summary comment. Do not approve or request changes.
          claude_args: |
            --model "${{ secrets.OPENROUTER_MODEL }}"
            --max-turns 20
            --append-system-prompt-file .github/prompts/pr-review.md
            --tools "Read,Glob,Grep,Bash"
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh api --method GET:*),Bash(gh api --method PATCH repos/${{ github.repository }}/issues/comments/*)"
            --disallowedTools "mcp__*"
